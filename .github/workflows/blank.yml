
name: Build QANOT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml topilmadi"
            exit 1
          }

      - name: Prepare Flutter entry point
        run: |
          if [ ! -f lib/main.dart ]; then
            if [ -f main.dart ]; then
              mkdir -p lib
              cp main.dart lib/main.dart
            else
              echo "ERROR: main.dart topilmadi"
              exit 1
            fi
          fi

      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --project-name qanot .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QANOT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
